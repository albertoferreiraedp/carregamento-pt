name: Migrar dados

# Corre UMA vez, manualmente, depois do primeiro run da Recolha com a nova configuração.
# 1) copia o branch data (histórico completo) do repositório público para o privado;
# 2) apaga os branches data e state do repositório público.
on:
  workflow_dispatch:

concurrency:
  group: recolha
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATA_URL: https://x-access-token:${{ secrets.DATA_TOKEN }}@github.com/${{ vars.DATA_REPO }}.git
      PUBLIC_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - name: Verificar que o estado já está no privado
        run: |
          git ls-remote --exit-code --heads "$DATA_URL" state >/dev/null || { echo "Primeiro tem de correr um run da Recolha com a nova configuração."; exit 1; }

      - name: Copiar branch data para o privado
        run: |
          if git ls-remote --exit-code --heads "$DATA_URL" data >/dev/null; then
            echo "O privado já tem branch data: nada a copiar."
          elif git ls-remote --exit-code --heads "$PUBLIC_URL" data >/dev/null; then
            git clone -q --branch data --single-branch "$PUBLIC_URL" pub
            git -C pub push -q "$DATA_URL" data:data
            echo "Branch data copiado com histórico completo."
          else
            echo "Não há branch data no público; o privado arranca vazio."
            mkdir vazio && cd vazio && git init -q -b data
            git config user.name "coletor" && git config user.email "coletor@users.noreply.github.com"
            echo "Arquivo diário (Parquet) da recolha." > README.md && git add README.md && git commit -qm "Início do arquivo"
            git push -q "$DATA_URL" data:data
          fi

      - name: Confirmar cópia
        run: git ls-remote --exit-code --heads "$DATA_URL" data

      - name: Apagar branches de dados do repositório público
        run: |
          git init -q tmp && cd tmp
          for b in data state; do
            if git ls-remote --exit-code --heads "$PUBLIC_URL" "$b" >/dev/null; then
              git push -q "$PUBLIC_URL" --delete "$b" && echo "Apagado: $b"
            fi
          done
